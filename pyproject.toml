[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vetkonect-backend"
version = "0.1.0"
description = "Production-oriented VetKonect Tanzania/Zanzibar backend"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.1,<6.0",
  "djangorestframework>=3.15,<4.0",
  "djangorestframework-simplejwt>=5.3,<6.0",
  "drf-spectacular>=0.28,<1.0",
  "django-filter>=24.3,<26.0",
  "django-cors-headers>=4.4,<5.0",
  "channels>=4.1,<5.0",
  "daphne>=4.1,<5.0",
  "channels-redis>=4.2,<5.0",
  "celery>=5.4,<6.0",
  "redis>=5.0,<6.0",
  "psycopg[binary]>=3.2,<4.0",
  "psycopg2-binary>=2.9,<3.0",
  "Pillow>=10.4,<12.0",
  "argon2-cffi>=23.1,<26.0",
  "python-json-logger>=2.0,<4.0",
  "django-storages>=1.14,<2.0",
  "boto3>=1.35,<2.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9.0",
  "pytest-django>=4.9,<5.0",
  "pytest-cov>=5.0,<7.0",
  "factory-boy>=3.3,<4.0",
  "model-bakery>=1.19,<2.0",
  "freezegun>=1.5,<2.0",
  "responses>=0.25,<1.0",
]
dev = ["ruff>=0.6,<1.0", "mypy>=1.11,<2.0", "django-stubs>=5.1,<6.0"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_tests.py"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["config*", "core*"]
